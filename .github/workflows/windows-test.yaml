name: Windows Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Build-Windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CMake build
        run: |
          mkdir cmake_build
          cd cmake_build
          cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Debug -A x64 ..
          cmake --build . --config Release --parallel
          ctest --output-on-failure

  # The compiled shader blobs are committed so the Pi and CI never need glslang.
  # That only stays safe if they cannot silently drift from the .glsl sources -
  # a stale blob makes the SDL_GPU backend render differently from the GL one.
  Shaders-Up-To-Date:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Recompile shaders
        run: |
          cmake -B shader_build -G "Visual Studio 17 2022" -A x64 -DVISAGE_BUILD_SHADERTOOL=ON -DVISAGE_BUILD_EXAMPLES=OFF -DVISAGE_BUILD_TESTS=OFF
          cmake --build shader_build --target shaders --config Release --parallel

      - name: Fail if the committed blobs differ
        run: git diff --exit-code -- "*/shaders/compiled"
